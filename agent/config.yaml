# ==============================================================================
#             AUTOMATED VIDEO CURATION AGENT — PHASE 3 CONFIG
# ==============================================================================

timezone: "America/New_York"  # US Eastern Time (primary audience timezone for English comedy YouTube Shorts)

# Daily automation schedule (Windows Scheduled Task runs in Asia/Kolkata)
daily_run:
  task_name: "100B Daily Video Bot"
  time_ist: "07:00"

# Execution goals & loop controls
target_count: 6           # Daily scheduled videos (YouTube upload quota: 6 videos per day)
spare_buffer: 2           # Extra buffer to ensure 6 ready videos
max_loops: 3              # Maximum re-planning loops if short on candidates
recursion_limit: 100      # LangGraph recursion limit for multi-loop execution
parallel_edits: 2         # Concurrency limit for video editing to protect CPU/GPU

# Reserve pool controls (stocks surplus clips so blocked days have ready backup videos)
reserve_pool:
  min_stock: 6               # Minimum reserve clips to maintain
  target_stock: 12           # Desired reserve stock depth (1-2 days buffer)
  stock_buffer_per_run: 2    # Extra clips to curate per normal run when reserve is below target

# Cost & LLM safety controls
cost_limits:
  max_cost_per_run_usd: 2.00   # Maximum LLM cost cap per curation run (USD)
  max_llm_calls_per_run: 100
  request_timeout_seconds: 75  # Per-call timeout (60-90s) for every Google / LLM request to prevent hanging
  judge_timeout_seconds_per_clip: 60 # Scalable time limit (60s per candidate clip, e.g. 6000s for 100 clips)
  judge_total_timeout_min_seconds: 300 # Minimum floor (5 mins) for vision judge stage
  judge_max_failure_rate: 0.30 # Maximum allowed judge failure rate (30%) before aborting run

# Per-Model Quota & Rate Limit Protection (Peak RPM, TPM, RPD)
rate_limits:
  safety_buffer: 0.85                   # Target 85% of quota threshold to prevent 429 errors
  models:
    "gemma-4-31b-it":
      max_requests_per_minute: 30       # Peak RPM: 30 calls / minute
      max_input_tokens_per_minute: 16000 # Peak TPM: 16,000 input tokens / minute (vision judge)
      max_requests_per_day: 14400       # Peak RPD: 14,400 requests / day
    "gemini-3.1-flash-lite":
      max_requests_per_minute: 15       # Peak RPM: 15 calls / minute
      max_input_tokens_per_minute: 250000 # Peak TPM: 250,000 tokens / minute (unthrottled for fast text calls)
      max_requests_per_day: 500         # Peak RPD: 500 requests / day
    "claude-3-5-haiku":
      max_requests_per_minute: 50
      max_input_tokens_per_minute: 50000
      max_requests_per_day: 5000
    default:
      max_requests_per_minute: 30
      max_input_tokens_per_minute: 30000
      max_requests_per_day: 1000

# LLM model selection (Google GenAI Gemini / Gemma or Anthropic Claude)
models:
  judge: "gemma-4-31b-it"               # vision judge: Gemma 4 31B (30 RPM, 16k TPM, 14.4k RPD)
  judge_fallback: "gemini-3.1-flash-lite" # vision fallback if Gemma has demand spikes (500 RPD, multimodal)
  caption: "gemini-3.1-flash-lite"      # text-only: Flash Lite (15 RPM, 250k TPM, 500 RPD)
  plan: "gemini-3.1-flash-lite"         # text-only
  discover: "gemini-3.1-flash-lite"     # text-only, 1 call/day
  title_prescreen: "gemini-3.1-flash-lite" # Verified fast lightweight text model for title pre-screening

judge_workers: 4                       # 4 parallel workers paced by 16k TPM token rate limiter

# Scoring & decision thresholds
scoring:
  llm_weight: 0.70                      # Weight given to LLM funny score (1-10)
  engagement_weight: 0.30               # Weight given to normalized upvotes/likes
  min_publish_score: 6.5                # Minimum threshold for daily top rank selection
  auto_approve_threshold: 6.5           # Top-N ranked with score >= 6.5 are auto-approved
  short_clip_duration_threshold: 8.0    # Clips under this length (seconds) are considered short clips
  short_clip_min_score: 7.5             # Higher score threshold required for short clips (< 8s) to justify daily slot
  auto_reject_threshold: 5.0            # < 5.0: Auto rejected; [5.0, lowest_chosen): Borderline
  human_review_min: 5.0                 # 5.0 to lowest chosen: Sent to borderline review
  human_review_max: 6.49

# Zero-cost pre-filtering & audio language check
filters:
  min_duration_seconds: 6.0             # Read from scraper/config.yaml (one source of truth)
  max_duration_seconds: 90.0            # YouTube Shorts allow up to 180s (since Oct 2024); 90s is quality choice
  min_duration: 6.0                     # Backward-compatible alias
  max_duration: 90.0                    # Backward-compatible alias
  min_resolution_height: 480            # Minimum vertical resolution
  blocked_words:
    - "death"
    - "kill"
    - "gore"
    - "blood"
    - "politics"
    - "biden"
    - "trump"
    - "war"
    - "murder"
    - "racist"
    - "suicide"
    - "terrorist"
    - "interview"
    - "broadcast"
    - "talk show"
    - "fallon"
    - "kimmel"
    - "colbert"
    - "conan"
    - "movie clip"
    - "tv show"
    - "hollywood"
  whisper:
    enabled: true
    model_size: "tiny"                  # "tiny" or "base"
    compute_type: "int8"
    vad_filter: true                    # Voice activity detection to find speech
    check_duration_seconds: 20          # Only check first 20 seconds of audio

# Video frame sampling for Vision LLM
vision:
  sample_frames: 3                      # Sample 3 keyframes across video duration
  target_width: 360                     # Downscaled to 360px width to lower tokens and accelerate evaluation

# Peak publishing hours (24h format in America/New_York) for highest-scoring videos (12:00, 14:00, 17:00, 19:00, 20:00, 21:00)
peak_hours:
  - 12
  - 14
  - 17
  - 19
  - 20
  - 21

# Allowed sources and exploration targets (Reddit is primary; Twitter is experimental)
reddit:
  enabled: true
  max_requests_per_run: 30
  max_requests_per_day: 80
  subreddits_per_run: 4
  listings:
    - "hot"
    - "top_day"
    - "top_week"

allowed_sources:
  twitter_enabled: false                # Explicitly disabled; Reddit is primary
  listings:
    - "hot"
    - "top_day"
    - "top_week"
  subreddits:
    - "funny"
    - "Unexpected"
    - "instant_regret"
    - "holdmybeer"
    - "Whatcouldgowrong"
    - "oddlysatisfying"
    - "MadeMeSmile"
    - "AnimalsBeingDerps"
    - "IdiotsInCars"
    - "nonononoyes"
    - "therewasanattempt"
    - "ContagiousLaughter"
    - "Catculations"
    - "dadjokes"
    - "ChildrenFallingOver"
  # Experimental: X (Twitter) accounts (requires cookies.txt for auth)
  twitter_accounts:
    - "DailyViralVids"
    - "AnimalsWorld"
    - "WholesomeMeme"
    - "LaughsDaily"

# ==============================================================================
#             RIGHTS & CONTENT ID PROTECTION (PHASE 6)
# ==============================================================================
rights:
  enabled: true
  local_only: true                     # Run in zero-cost Local-Only mode until billing enabled on Cloud Vision
  unreviewed_policy: "hold"            # "hold" sets private with no publishAt; "publish" leaves scheduled
  on_provider_error: "review"          # Never silently pass on error; always mark for review
  prefer_max_seconds: 60.0             # Soft risk penalty for clips > 60s

  # Provider limits & daily caps
  providers:
    shazam:
      enabled: true
      daily_cap: 100                   # Free, but be polite: max 100 calls / day (Shazam allows ~20/min)
      multi_sample_threshold: 0.60     # Send 2nd sample only if unrecognized and music_fraction >= 0.60
    google_vision:
      enabled: false                   # Disabled in local-only mode; enable when Cloud project billing is ready
      daily_cap: 25                    # Hard daily cap
      budget_alert_threshold: 800      # Monthly units alert before reaching 1000 free tier limit

  # Weights and risk scoring thresholds (capped at 100)
  weights:
    hard_block_score: 100
    unrecognized_music: 35
    high_web_matches: 30
    duration_over_60s: 15
    high_claim_subreddit: 20
    social_watermark_review: 40

  # Decision bands
  thresholds:
    block: 80                          # Score >= 80 -> hard block
    review: 30                         # Score in [30, 79] -> review required


